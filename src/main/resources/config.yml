# Liga/desliga o plugin (tambem pelo comando /fd on|off)
enabled: true

# Intervalo entre drops, em ticks (20 ticks = 1 segundo)
# 1  = 1 stack por tick    (20 stacks/s)
# 20 = 1 stack por segundo
# Tambem pelo comando /fd speed <ticks>
interval-ticks: 1

# Quais blocos o plugin afeta
# affect-droppers   = ejetores (dropper)
# affect-dispensers = dispensers
affect-droppers: true
affect-dispensers: false

# Mostra no console o que acontece em cada disparo (/fd debug on|off)
debug: true

# Materiais que o plugin NAO deve interceptar (ficam com o comportamento
# normal do dispenser / DispenserRobot). Exemplo:
# ignored-materials: [ARROW, FIRE_CHARGE, WATER_BUCKET]
ignored-materials: []
