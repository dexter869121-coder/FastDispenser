name: FastDispenser
version: ${project.version}
main: com.example.fastdispenser.FastDispenser
api-version: "26.3"
description: Dispensers que soltam um stack inteiro por vez, de forma continua.
softdepend:
  - DispenserRobot

commands:
  fastdispenser:
    description: Controla o FastDispenser
    usage: /<command> [on|off|toggle|speed <ticks>|debug [on|off]|test|reload|status]
    aliases: [fd]
    permission: fastdispenser.admin

permissions:
  fastdispenser.admin:
    description: Permite usar o comando /fastdispenser
    default: op
